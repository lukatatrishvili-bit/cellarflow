<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><text y=%220.9em%22 font-size=%2290%22>🍇</text></svg>" />
    <title>VinOS | Unified Winery &amp; Vineyard Control</title>

    <!-- PWA: installable + offline cellar use -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4e0e15" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <style>
      :root {
        --font-sans: 'Outfit', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload the 3 above-the-fold families (Cormorant display, Outfit sans, JetBrains mono) -->

  </head>
  <body class="antialiased bg-[#fbf9f6] text-[#1e1915]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

         it never interferes with the dev server's HMR. -->
  </body>
</html>
