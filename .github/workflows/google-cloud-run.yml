name: Google Cloud Run Deploy

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Google Cloud project ID
        required: true
      region:
        description: Cloud Run and Artifact Registry region
        required: true
        default: europe-west1
      service:
        description: Cloud Run service name
        required: true
        default: cellarflow-app
      artifact_repository:
        description: Artifact Registry Docker repository
        required: true
        default: cellarflow
      cloudsql_instance:
        description: Optional Cloud SQL connection name
        required: false
        default: cellarflow:europe-west1:cellarflow-postgres
      gcs_bucket:
        description: GCS bucket for durable db.json backup, without gs://
        required: true
        default: cellarflow-db
      gcs_db_object:
        description: Object path inside the bucket
        required: true
        default: db.json
      demo_login_enabled:
        description: Enable public demo workspace
        required: true
        default: "false"
      runtime_service_account:
        description: Optional Cloud Run runtime service account email
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-${{ inputs.project_id }}-${{ inputs.service }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source revision
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build_image:
    name: Build and verify immutable image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_digest: ${{ steps.image.outputs.image_digest }}
    env:
      HAS_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      SERVICE: ${{ inputs.service }}
      ARTIFACT_REPOSITORY: ${{ inputs.artifact_repository }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@v4

      - name: Authenticate with Workload Identity
        if: env.HAS_WIF == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with service account JSON
        if: env.HAS_WIF != 'true' && env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Require Google Cloud authentication
        if: env.HAS_WIF != 'true' && env.HAS_SA_KEY != 'true'
        run: |
          echo "Configure Workload Identity secrets or GCP_SA_KEY."
          exit 1

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Prepare Artifact Registry
        run: |
          set -euo pipefail
          gcloud services enable artifactregistry.googleapis.com --project "$PROJECT_ID"

          if ! gcloud artifacts repositories describe "$ARTIFACT_REPOSITORY" \
            --project "$PROJECT_ID" \
            --location "$REGION" >/dev/null 2>&1; then
            gcloud artifacts repositories create "$ARTIFACT_REPOSITORY" \
              --project "$PROJECT_ID" \
              --location "$REGION" \
              --repository-format docker \
              --immutable-tags \
              --description "CI-verified CellarFlow release images"
          fi

          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build, boot-smoke, and push the image
        id: image
        run: |
          set -euo pipefail
          IMAGE_NAME="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE}"
          IMAGE_TAG="${IMAGE_NAME}:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          MISSING_SECRET_CONTAINER="cellarflow-missing-secret-${GITHUB_RUN_ID}"
          HEALTHY_CONTAINER="cellarflow-release-smoke-${GITHUB_RUN_ID}"

          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE_TAG" .

          set +e
          timeout 20s docker run --name "$MISSING_SECRET_CONTAINER" "$IMAGE_TAG" \
            >missing-secret.log 2>&1
          MISSING_SECRET_EXIT=$?
          set -e
          docker rm --force "$MISSING_SECRET_CONTAINER" >/dev/null 2>&1 || true

          if [ "$MISSING_SECRET_EXIT" -eq 0 ] || [ "$MISSING_SECRET_EXIT" -eq 124 ]; then
            cat missing-secret.log
            echo "The release image did not fail fast without SESSION_SECRET."
            exit 1
          fi
          if ! grep --fixed-strings --quiet "SESSION_SECRET must be set in production" missing-secret.log; then
            cat missing-secret.log
            echo "The release image failed for an unexpected reason without SESSION_SECRET."
            exit 1
          fi

          docker run --detach \
            --name "$HEALTHY_CONTAINER" \
            --publish 127.0.0.1:3000:3000 \
            --env "SESSION_SECRET=cellarflow-container-smoke-secret-32-bytes" \
            --env "DATABASE_URL=" \
            --env "GCS_BUCKET=" \
            --env "DEMO_LOGIN_ENABLED=false" \
            "$IMAGE_TAG"
          trap 'docker logs "$HEALTHY_CONTAINER" || true; docker rm --force "$HEALTHY_CONTAINER" >/dev/null 2>&1 || true' EXIT

          docker exec \
            --env "PRODUCTION_SMOKE_BASE_URL=http://127.0.0.1:3000" \
            --env "PRODUCTION_SMOKE_EXPECT_READINESS=not-ready" \
            "$HEALTHY_CONTAINER" npm run test:production-smoke

          docker push "$IMAGE_TAG"
          IMAGE_DIGEST="$(gcloud artifacts docker images describe "$IMAGE_TAG" \
            --project "$PROJECT_ID" \
            --format='value(image_summary.digest)')"
          if [[ "$IMAGE_DIGEST" != sha256:* ]]; then
            echo "Artifact Registry did not return a valid image digest: $IMAGE_DIGEST"
            exit 1
          fi

          IMAGE_URI="${IMAGE_NAME}@${IMAGE_DIGEST}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_digest=$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "Verified image: $IMAGE_URI"

  deploy:
    name: Deploy verified image digest
    needs: build_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.service.outputs.url }}
    env:
      HAS_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && secrets.GCP_SERVICE_ACCOUNT != '' }}
      HAS_SA_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      PROJECT_ID: ${{ inputs.project_id }}
      REGION: ${{ inputs.region }}
      SERVICE: ${{ inputs.service }}
      CLOUDSQL_INSTANCE: ${{ inputs.cloudsql_instance }}
      CLOUDSQL_BACKUP_START_TIME: "02:00"
      CLOUDSQL_RETAINED_BACKUPS: "30"
      CLOUDSQL_TRANSACTION_LOG_DAYS: "7"
      GCS_BUCKET: ${{ inputs.gcs_bucket }}
      GCS_DB_OBJECT: ${{ inputs.gcs_db_object }}
      DEMO_LOGIN_ENABLED: ${{ inputs.demo_login_enabled }}
      RUNTIME_SERVICE_ACCOUNT_INPUT: ${{ inputs.runtime_service_account }}
      IMAGE_URI: ${{ needs.build_image.outputs.image_uri }}
      IMAGE_DIGEST: ${{ needs.build_image.outputs.image_digest }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      WHATSAPP_ENABLED: ${{ vars.WHATSAPP_ENABLED || 'false' }}
      WHATSAPP_GRAPH_API_VERSION: ${{ vars.WHATSAPP_GRAPH_API_VERSION || 'v26.0' }}
      WHATSAPP_TASK_TEMPLATE_NAME: ${{ vars.WHATSAPP_TASK_TEMPLATE_NAME || 'cellarflow_task_assignment' }}
      WHATSAPP_TASK_TEMPLATE_LANGUAGE_EN: ${{ vars.WHATSAPP_TASK_TEMPLATE_LANGUAGE_EN || 'en_US' }}
      WHATSAPP_TASK_TEMPLATE_LANGUAGE_KA: ${{ vars.WHATSAPP_TASK_TEMPLATE_LANGUAGE_KA || 'ka' }}
      BILLING_ENABLED: ${{ vars.BILLING_ENABLED || 'false' }}
      TBC_API_BASE_URL: ${{ vars.TBC_API_BASE_URL || 'https://api.tbcbank.ge' }}
      TBC_RECURRING_ENABLED: ${{ vars.TBC_RECURRING_ENABLED || 'false' }}
      BILLING_VAT_LABEL_EN: ${{ vars.BILLING_VAT_LABEL_EN }}
      BILLING_VAT_LABEL_KA: ${{ vars.BILLING_VAT_LABEL_KA }}
    steps:
      - name: Authenticate with Workload Identity
        if: env.HAS_WIF == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate with service account JSON
        if: env.HAS_WIF != 'true' && env.HAS_SA_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Require Google Cloud authentication
        if: env.HAS_WIF != 'true' && env.HAS_SA_KEY != 'true'
        run: |
          echo "Configure Workload Identity secrets or GCP_SA_KEY."
          exit 1

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Prepare runtime infrastructure
        run: |
          set -euo pipefail
          gcloud services enable \
            run.googleapis.com \
            storage.googleapis.com \
            secretmanager.googleapis.com \
            sqladmin.googleapis.com \
            --project "$PROJECT_ID"

          if [ -n "$RUNTIME_SERVICE_ACCOUNT_INPUT" ]; then
            RUNTIME_SERVICE_ACCOUNT="$RUNTIME_SERVICE_ACCOUNT_INPUT"
          else
            PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
            RUNTIME_SERVICE_ACCOUNT="${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
          fi

          if ! gcloud storage buckets describe "gs://${GCS_BUCKET}" --project "$PROJECT_ID" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${GCS_BUCKET}" \
              --project "$PROJECT_ID" \
              --location "$REGION" \
              --uniform-bucket-level-access
          fi

          gcloud storage buckets add-iam-policy-binding "gs://${GCS_BUCKET}" \
            --project "$PROJECT_ID" \
            --member "serviceAccount:${RUNTIME_SERVICE_ACCOUNT}" \
            --role "roles/storage.objectAdmin" \
            --quiet

          echo "RUNTIME_SERVICE_ACCOUNT=${RUNTIME_SERVICE_ACCOUNT}" >> "$GITHUB_ENV"

      - name: Enforce Cloud SQL backup and PITR policy
        if: env.CLOUDSQL_INSTANCE != ''
        run: |
          set -euo pipefail
          IFS=':' read -r SQL_PROJECT SQL_REGION SQL_INSTANCE SQL_EXTRA <<< "$CLOUDSQL_INSTANCE"
          if [ -z "$SQL_PROJECT" ] || [ -z "$SQL_REGION" ] || [ -z "$SQL_INSTANCE" ] || [ -n "${SQL_EXTRA:-}" ]; then
            echo "cloudsql_instance must use PROJECT:REGION:INSTANCE format."
            exit 1
          fi
          if [ "$SQL_PROJECT" != "$PROJECT_ID" ] || [ "$SQL_REGION" != "$REGION" ]; then
            echo "Cloud SQL project and region must match the deployment target."
            exit 1
          fi

          ACTIVE_OPS=$(gcloud sql operations list --instance="$SQL_INSTANCE" --project="$PROJECT_ID" --filter="status=RUNNING" --format="value(name)" 2>/dev/null || true)
          if [ -n "$ACTIVE_OPS" ]; then
            echo "Waiting for active Cloud SQL operation(s) to complete before patching..."
            for OP in $ACTIVE_OPS; do
              gcloud beta sql operations wait "$OP" --project="$PROJECT_ID" || true
            done
          fi

          gcloud sql instances patch "$SQL_INSTANCE" \
            --project "$PROJECT_ID" \
            --backup-location "$REGION" \
            --backup-start-time "$CLOUDSQL_BACKUP_START_TIME" \
            --retained-backups-count "$CLOUDSQL_RETAINED_BACKUPS" \
            --retained-transaction-log-days "$CLOUDSQL_TRANSACTION_LOG_DAYS" \
            --enable-point-in-time-recovery \
            --retain-backups-on-delete \
            --quiet || {
              echo "Patch command exited. Checking for running operations..."
              ACTIVE_OPS=$(gcloud sql operations list --instance="$SQL_INSTANCE" --project="$PROJECT_ID" --filter="status=RUNNING" --format="value(name)" 2>/dev/null || true)
              if [ -n "$ACTIVE_OPS" ]; then
                for OP in $ACTIVE_OPS; do
                  echo "Waiting for Cloud SQL operation $OP to finish..."
                  gcloud beta sql operations wait "$OP" --project="$PROJECT_ID"
                done
              else
                exit 1
              fi
            }

      - name: Run controlled database migrations
        run: |
          set -euo pipefail
          MIGRATION_JOB="${SERVICE}-migrate"
          MIGRATION_ARGS=(
            --image "$IMAGE_URI"
            --project "$PROJECT_ID"
            --region "$REGION"
            --service-account "$RUNTIME_SERVICE_ACCOUNT"
            --command npm
            --args "run,db:migrate:deploy"
            --set-secrets "DATABASE_URL=cellarflow-database-url:latest"
            --set-env-vars "PRISMA_BASELINE_EXISTING_SCHEMA=true"
            --labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}"
            --tasks 1
            --max-retries 0
            --task-timeout 10m
            --execute-now
            --wait
          )

          if [ -n "$CLOUDSQL_INSTANCE" ]; then
            MIGRATION_ARGS+=(--set-cloudsql-instances "$CLOUDSQL_INSTANCE")
          fi

          gcloud run jobs deploy "$MIGRATION_JOB" "${MIGRATION_ARGS[@]}"
          echo "MIGRATION_JOB=$MIGRATION_JOB" >> "$GITHUB_ENV"

      - name: Deploy the verified digest
        run: |
          set -euo pipefail
          DEPLOY_ARGS=(
            --image "$IMAGE_URI"
            --project "$PROJECT_ID"
            --region "$REGION"
            --allow-unauthenticated
            --max-instances 1
            --service-account "$RUNTIME_SERVICE_ACCOUNT"
            --update-labels "managed-by=github-actions,commit-sha=${GITHUB_SHA}"
            --update-env-vars "NODE_ENV=production"
            --update-secrets "SESSION_SECRET=cellarflow-session-secret:latest"
            --update-secrets "DATABASE_URL=cellarflow-database-url:latest"
            --update-secrets "GEMINI_API_KEY=cellarflow-gemini-api-key:latest"
            --update-secrets "GOOGLE_CLIENT_ID=cellarflow-google-client-id:latest"
            --update-secrets "GOOGLE_CLIENT_SECRET=cellarflow-google-client-secret:latest"
            --update-secrets "ADMIN_USERNAME=cellarflow-admin-username:latest"
            --update-secrets "ADMIN_PASSCODE=cellarflow-admin-passcode:latest"
            --update-secrets "SMTP_PASS=cellarflow-smtp-pass:latest"
            --remove-env-vars "PRISMA_DB_PUSH_ON_STARTUP"
            --update-env-vars "GOOGLE_CLOUD_REGION=$REGION"
            --update-env-vars "GCS_BUCKET=$GCS_BUCKET"
            --update-env-vars "GCS_DB_OBJECT=$GCS_DB_OBJECT"
            --update-env-vars "DEMO_LOGIN_ENABLED=$DEMO_LOGIN_ENABLED"
          )

          if [ -n "$CLOUDSQL_INSTANCE" ]; then DEPLOY_ARGS+=(--add-cloudsql-instances "$CLOUDSQL_INSTANCE"); fi
          if [ "$WHATSAPP_ENABLED" = "true" ]; then
            DEPLOY_ARGS+=(
              --update-secrets "WHATSAPP_ACCESS_TOKEN=cellarflow-whatsapp-access-token:latest"
              --update-secrets "WHATSAPP_PHONE_NUMBER_ID=cellarflow-whatsapp-phone-number-id:latest"
              --update-secrets "WHATSAPP_WEBHOOK_VERIFY_TOKEN=cellarflow-whatsapp-webhook-verify-token:latest"
              --update-secrets "WHATSAPP_APP_SECRET=cellarflow-whatsapp-app-secret:latest"
              --update-env-vars "WHATSAPP_GRAPH_API_VERSION=$WHATSAPP_GRAPH_API_VERSION"
              --update-env-vars "WHATSAPP_TASK_TEMPLATE_NAME=$WHATSAPP_TASK_TEMPLATE_NAME"
              --update-env-vars "WHATSAPP_TASK_TEMPLATE_LANGUAGE_EN=$WHATSAPP_TASK_TEMPLATE_LANGUAGE_EN"
              --update-env-vars "WHATSAPP_TASK_TEMPLATE_LANGUAGE_KA=$WHATSAPP_TASK_TEMPLATE_LANGUAGE_KA"
            )
          fi
          if [ "$BILLING_ENABLED" = "true" ]; then
            DEPLOY_ARGS+=(
              --update-secrets "TBC_API_KEY=cellarflow-tbc-api-key:latest"
              --update-secrets "TBC_CLIENT_ID=cellarflow-tbc-client-id:latest"
              --update-secrets "TBC_CLIENT_SECRET=cellarflow-tbc-client-secret:latest"
              --update-secrets "BILLING_CRON_SECRET=cellarflow-billing-cron-secret:latest"
              --update-env-vars "TBC_API_BASE_URL=$TBC_API_BASE_URL"
              --update-env-vars "TBC_RECURRING_ENABLED=$TBC_RECURRING_ENABLED"
            )
            if [ -n "$BILLING_VAT_LABEL_EN" ]; then DEPLOY_ARGS+=(--update-env-vars "BILLING_VAT_LABEL_EN=$BILLING_VAT_LABEL_EN"); fi
            if [ -n "$BILLING_VAT_LABEL_KA" ]; then DEPLOY_ARGS+=(--update-env-vars "BILLING_VAT_LABEL_KA=$BILLING_VAT_LABEL_KA"); fi
          fi
          if [ -n "$SMTP_HOST" ]; then DEPLOY_ARGS+=(--update-env-vars "SMTP_HOST=$SMTP_HOST"); fi
          if [ -n "$SMTP_PORT" ]; then DEPLOY_ARGS+=(--update-env-vars "SMTP_PORT=$SMTP_PORT"); fi
          if [ -n "$SMTP_SECURE" ]; then DEPLOY_ARGS+=(--update-env-vars "SMTP_SECURE=$SMTP_SECURE"); fi
          if [ -n "$SMTP_USER" ]; then DEPLOY_ARGS+=(--update-env-vars "SMTP_USER=$SMTP_USER"); fi
          if [ -n "$MAIL_FROM" ]; then DEPLOY_ARGS+=(--update-env-vars "MAIL_FROM=$MAIL_FROM"); fi

          gcloud run deploy "$SERVICE" "${DEPLOY_ARGS[@]}"

      - name: Set the canonical service URL
        id: service
        run: |
          set -euo pipefail
          SERVICE_URL="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.url)')"

          gcloud run services update "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --update-env-vars "APP_URL=$SERVICE_URL"

          RELEASE_REVISION="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestCreatedRevisionName)')"
          if [ -z "$RELEASE_REVISION" ]; then
            echo "Cloud Run did not report the revision created by this release."
            exit 1
          fi

          # Existing preview tags can pin production traffic to an older named
          # revision. Explicitly promote the final revision after APP_URL is set.
          gcloud run services update-traffic "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --to-revisions "${RELEASE_REVISION}=100"

          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "RELEASE_REVISION=$RELEASE_REVISION" >> "$GITHUB_ENV"

      - name: Deploy and schedule deterministic AI operations
        run: |
          set -euo pipefail
          gcloud services enable run.googleapis.com cloudscheduler.googleapis.com \
            --project "$PROJECT_ID"

          deploy_monitor_job() {
            local cadence="$1"
            local job="${SERVICE}-ai-monitor-${cadence}"
            local args=(
              --image "$IMAGE_URI"
              --project "$PROJECT_ID"
              --region "$REGION"
              --service-account "$RUNTIME_SERVICE_ACCOUNT"
              --command npm
              --args "run,ai:monitor,--,${cadence}"
              --set-secrets "DATABASE_URL=cellarflow-database-url:latest"
              --set-env-vars "NODE_ENV=production,GCS_BUCKET=$GCS_BUCKET,GCS_DB_OBJECT=$GCS_DB_OBJECT"
              --labels "managed-by=github-actions,operation=ai-monitor-${cadence},commit-sha=${GITHUB_SHA}"
              --tasks 1
              --max-retries 1
              --task-timeout 15m
            )
            if [ -n "$CLOUDSQL_INSTANCE" ]; then
              args+=(--set-cloudsql-instances "$CLOUDSQL_INSTANCE")
            fi
            gcloud run jobs deploy "$job" "${args[@]}"
          }

          for cadence in hourly daily weekly; do
            deploy_monitor_job "$cadence"
          done

          DELIVERY_JOB="${SERVICE}-ai-deliver"
          DELIVERY_ARGS=(
            --image "$IMAGE_URI"
            --project "$PROJECT_ID"
            --region "$REGION"
            --service-account "$RUNTIME_SERVICE_ACCOUNT"
            --command npm
            --args "run,ai:deliver,--,100"
            --set-secrets "DATABASE_URL=cellarflow-database-url:latest"
            --set-secrets "SMTP_PASS=cellarflow-smtp-pass:latest"
            --set-env-vars "NODE_ENV=production,APP_URL=$SERVICE_URL"
            --labels "managed-by=github-actions,operation=ai-deliver,commit-sha=${GITHUB_SHA}"
            --tasks 1
            --max-retries 0
            --task-timeout 15m
          )
          if [ -n "$CLOUDSQL_INSTANCE" ]; then
            DELIVERY_ARGS+=(--set-cloudsql-instances "$CLOUDSQL_INSTANCE")
          fi
          if [ -n "$SMTP_HOST" ]; then DELIVERY_ARGS+=(--set-env-vars "SMTP_HOST=$SMTP_HOST"); fi
          if [ -n "$SMTP_PORT" ]; then DELIVERY_ARGS+=(--set-env-vars "SMTP_PORT=$SMTP_PORT"); fi
          if [ -n "$SMTP_SECURE" ]; then DELIVERY_ARGS+=(--set-env-vars "SMTP_SECURE=$SMTP_SECURE"); fi
          if [ -n "$SMTP_USER" ]; then DELIVERY_ARGS+=(--set-env-vars "SMTP_USER=$SMTP_USER"); fi
          if [ -n "$MAIL_FROM" ]; then DELIVERY_ARGS+=(--set-env-vars "MAIL_FROM=$MAIL_FROM"); fi
          gcloud run jobs deploy "$DELIVERY_JOB" "${DELIVERY_ARGS[@]}"

          schedule_job() {
            local scheduler_name="$1"
            local run_job="$2"
            local schedule="$3"
            local uri="https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/jobs/${run_job}:run"
            local args=(
              --location "$REGION"
              --schedule "$schedule"
              --time-zone "Etc/UTC"
              --uri "$uri"
              --http-method POST
              --message-body "{}"
              --headers "Content-Type=application/json"
              --oauth-service-account-email "$RUNTIME_SERVICE_ACCOUNT"
              --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform"
              --attempt-deadline "180s"
              --max-retry-attempts 2
              --min-backoff "30s"
              --max-backoff "300s"
            )
            gcloud run jobs add-iam-policy-binding "$run_job" \
              --project "$PROJECT_ID" \
              --region "$REGION" \
              --member "serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
              --role "roles/run.invoker" \
              --quiet
            if gcloud scheduler jobs describe "$scheduler_name" \
              --project "$PROJECT_ID" \
              --location "$REGION" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$scheduler_name" \
                --project "$PROJECT_ID" \
                "${args[@]}"
            else
              gcloud scheduler jobs create http "$scheduler_name" \
                --project "$PROJECT_ID" \
                "${args[@]}"
            fi
          }

          schedule_job "${SERVICE}-ai-delivery" "$DELIVERY_JOB" "*/15 * * * *"
          schedule_job "${SERVICE}-ai-monitor-hourly" "${SERVICE}-ai-monitor-hourly" "7 * * * *"
          schedule_job "${SERVICE}-ai-monitor-daily" "${SERVICE}-ai-monitor-daily" "17 2 * * *"
          schedule_job "${SERVICE}-ai-monitor-weekly" "${SERVICE}-ai-monitor-weekly" "47 2 * * 1"

      - name: Verify deployed digest and health
        run: |
          set -euo pipefail
          LATEST_REVISION="$(gcloud run services describe "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(status.latestReadyRevisionName)')"
          if [ "$LATEST_REVISION" != "$RELEASE_REVISION" ]; then
            echo "Expected latest ready revision: $RELEASE_REVISION"
            echo "Cloud Run latest ready revision: $LATEST_REVISION"
            exit 1
          fi
          DEPLOYED_IMAGE="$(gcloud run revisions describe "$LATEST_REVISION" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --format='value(spec.containers[0].image)')"

          if [[ "$DEPLOYED_IMAGE" != *@"$IMAGE_DIGEST" ]]; then
            echo "Expected deployed digest: $IMAGE_DIGEST"
            echo "Latest ready revision image: $DEPLOYED_IMAGE"
            exit 1
          fi

          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 2 "$SERVICE_URL/api/health"
          curl --fail --silent --show-error --retry 10 --retry-all-errors \
            --retry-delay 2 "$SERVICE_URL/api/ready"
          echo "LATEST_REVISION=$LATEST_REVISION" >> "$GITHUB_ENV"

      - name: Deployment summary
        run: |
          {
            echo "## Production deployment"
            echo ""
            echo "- Service: \`$SERVICE\`"
            echo "- Revision: \`$LATEST_REVISION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Image: \`$IMAGE_URI\`"
            echo "- Migration job: \`$MIGRATION_JOB\`"
            echo "- Cloud SQL backup policy: 30 daily backups, 7-day PITR logs (02:00 UTC)"
            echo "- URL: $SERVICE_URL"
          } >> "$GITHUB_STEP_SUMMARY"
