version: '3.8'

services:
  vinea-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PORT=3000
      - DATABASE_PATH=/app/data/db.json
    volumes:
      # Mount a data directory to allow safe file write/rename cycles inside the container
      - ./data:/app/data
    restart: unless-stopped
